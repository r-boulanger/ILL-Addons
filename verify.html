      const old = btn.textContent;
      try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = "Copied"; } catch(e){ btn.textContent = "Copy failed"; }
      setTimeout(() => btn.textContent = old, 1400);
    });
    wireOthers(res, renderEResource);
    wireFetchPdf(res);
    sendCitation(res);
    const firstCheck = !autoFetchConsidered;
    autoFetchConsidered = true;
    res.accessReady = loadAccess(res).catch(() => {}).finally(() => {
      if (!res.almaLinks) res.almaLinks = [];
      refreshFetchCard(res);
      track("check", checkFields(res, res.almaLinks.length));
    });
    res.accessReady.then(() => { if (firstCheck) maybeAutoFetch(res); });
  }

  /* ---------- Fetch PDF (eResource page) ----------
     Asks StrategyAgent.lua (function FetchPdf) to download the article on this
     PC (campus IP) and hold it for review (or save it as <TN>.pdf in the
     PdfSaveFolder setting when review is off). See maybeAutoFetch for the
     automatic fetch when the tab opens. */
  function fetchPdfCard(res){
    const tn = String(request.TransactionNumber || "").trim();
    const h = '<div class="card" id="pdf-card"><h2>Fetch PDF</h2>' +
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">' +
      '<button type="button" class="primary" id="fetch-pdf">Fetch PDF' + (tn ? " → " + esc(tn) + ".pdf" : "") + "</button>" +
      '<span class="pct" id="pdf-sources"></span></div>' +
      '<div class="pct" id="pdf-alma" style="margin-top:6px"></div>' +
      '<p class="modetag" id="pdf-why" style="margin:8px 0 0"></p>' +
      '<div id="pdf-status" style="margin-top:10px"></div></div>';
    setTimeout(() => refreshFetchCard(res), 0);
    return h;
  }
  /* Where Fetch PDF will look, in order. Bowdoin's verified links arrive when
     the Bowdoin access check finishes, so this runs again then. */
  function refreshFetchCard(res){
    const btn = $("fetch-pdf"); if (!btn) return;
    const b = res.best || {};
    const doi = b.doi || findDOI(request);
    const tn = String(request.TransactionNumber || "").trim();
    const trusted = res.confidence === "High" || res.confidence === "Medium";
    const alma = res.almaLinks || [];
    const any = !!(doi || (res.oa && res.oa.url) || cfg.eds || alma.length);
    let why = "";
    if (!tn) why = "This request has no transaction number to name the file.";
    else if (!any) why = res.almaLinks ? "No Bowdoin access link, DOI or free copy was found, so there is nothing to fetch automatically."
                                       : "No DOI or free copy was found. Waiting for the Bowdoin access check…";
    else if (!trusted) why = cfg.review
      ? "The citation isn't verified (confidence " + res.confidence + "), so check the PDF's first page carefully before saving."
      : "The citation isn't verified (confidence " + res.confidence + "). Confirm the right item before fetching.";
    const steps = [alma.length ? "Bowdoin's access (" + alma.length + " link" + (alma.length === 1 ? "" : "s") + ")" : "",
                   res.oa && res.oa.url ? "the free copy" : "", cfg.eds ? "EBSCO" : "", doi ? "the publisher via DOI " + doi : ""].filter(Boolean);
    $("pdf-sources").textContent = steps.length ? steps.reduce((t, x, i, a) => t + (i === 0 ? "Tries " : i === a.length - 1 ? ", then " : ", ") + x, "") + "." : "";
    $("pdf-alma").innerHTML = alma.length ? "Bowdoin access, in order: " + alma.map(([n, u], i) => (i + 1) + ". " + link(u, n)).join(" · ") : "";
    $("pdf-why").textContent = why; $("pdf-why").hidden = !why;
    // don't touch the button while a fetch or review is under way
    if (!$("pdf-status").innerHTML.trim()) btn.disabled = !tn || !any;
  }
  function wireFetchPdf(res){
    const btn = $("fetch-pdf"); if (!btn) return;
    btn.onclick = () => doFetch(res, false);
  }
  async function doFetch(res, auto, skip){
      skip = skip || "";
      const btn = $("fetch-pdf"), st = $("pdf-status"); if (!btn || !st) return;
      const b = res.best || {};
      const doi = b.doi || findDOI(request) || "";
      const oa = (res.oa && res.oa.url) || "";
      const tn = String(request.TransactionNumber || "").trim();
      btn.disabled = true;
      st.innerHTML = '<div class="progress"><span class="spin"></span>' + (skip ? "Trying a different way to fetch the PDF… " : auto ? "Fetching the PDF automatically (citation confidence: " + esc(res.confidence || "unknown") + ")… " : "Downloading… ") + "ILLiad may pause for a few seconds.</div>";
      let raw;
      const t0 = Date.now();
      const how = skip ? "try again" : auto ? "auto" : "manual";
      const wantTitle = [b.title, b.subtitle].filter(Boolean).join(": ") || reqView(request).title || "";
      const wantAuthor = surname(((b.authors || [])[0]) || reqView(request).author || "");
      if (res.accessReady) await res.accessReady;          // Bowdoin's links come from the access check
      const almaText = (res.almaLinks || []).map(([n, u]) => String(n).replace(/[\t\r\n]+/g, " ") + "\t" + u).join("\n");
      try { raw = String(await bridgeCall("FetchPdf", tn, doi, oa, skip, wantTitle, wantAuthor, almaText) || ""); }
      catch(e){ st.innerHTML = '<p class="modetag" style="margin:0">' + esc(e.message.replace("automatic access check", "PDF download")) + "</p>"; btn.disabled = false; return; }
      const lines = raw.split("\n");
      const secs = Math.round((Date.now() - t0) / 1000);
      if (lines[0] === "OK" || lines[0] === "PENDING"){
        const [kind, path, bytes, source, pageTitle, pageDoi, route] = lines;
        const expected = [b.title, b.subtitle].filter(Boolean).join(": ") || reqView(request).title || "";
        const titleOk = pageTitle ? Math.max(similarity(expected, pageTitle), similarity(pageTitle, expected)) : null;
        const doiOk = pageDoi ? pageDoi.toLowerCase() === doi.toLowerCase() : null;
        const warn = (doiOk === false) || (titleOk !== null && titleOk < 0.6);
        const checks = esc((Number(bytes)/1048576).toFixed(1) + " MB from " + source) +
                (pageDoi ? " · page DOI " + (doiOk ? "matches" : "DIFFERENT: " + pageDoi) : "") +
                (pageTitle ? " · page title " + (titleOk >= 0.6 ? "matches" : "looks different: “" + pageTitle + "”") : "");
        track("fetch", { auto: how, outcome: "fetched", route: route || "", host: hostOnly(source), seconds: secs, confidence: res.confidence || "" });
        if (kind === "PENDING") return showReview(res, auto, { path, checks, warn, doiBad: doiOk === false, tn, doi, route: route || "", skip, source });
        track("saved", { route: route || "", host: hostOnly(source), detail: "saved without review" });
        let h = (auto ? '<div class="pct" style="margin-bottom:6px">Fetched automatically (citation confidence: ' + esc(res.confidence || "unknown") + ').</div>' : "") +
                '<span class="badge ' + (warn ? "Low" : "High") + '">' + (warn ? "Saved, check it" : "Saved") + "</span> " +
                '<button type="button" data-copy="' + esc(path) + '" title="Copy file path">' + esc(path) + "</button>" +
                '<div class="pct" style="margin-top:6px">' + checks + "</div>";
        if (warn) h += '<p style="margin:8px 0 0">The publisher page may be a different article. Open the PDF and check it before sending.</p>';
        st.innerHTML = h;
        summary += "\nPDF saved: " + path;
      } else {
        const msg = lines[1] || "Unknown error", page = lines[2] || (doi ? "https://doi.org/" + doi : "");
        const browserUrl = ((lines.find(l => l.startsWith("BROWSER\t")) || "").split("\t")[1]) || "";
        track("fetch", { auto: how, outcome: browserUrl ? "needs browser" : "failed", host: hostOnly(browserUrl || page), seconds: secs,
                         confidence: res.confidence || "", detail: String(msg).slice(0, 160) });
        st.innerHTML = (skip ? '<div class="pct" style="margin-bottom:6px">The previous PDF was discarded and nothing was saved.</div>' : auto ? '<div class="pct" style="margin-bottom:6px">Tried automatically (citation confidence: ' + esc(res.confidence || "unknown") + ').</div>' : "") +
          '<span class="badge ' + (browserUrl ? "Medium" : "None") + '">' + (browserUrl ? "Needs the browser" : "Not fetched") + "</span> " + esc(msg) +
          (browserUrl ? browserFetchHtml(browserUrl, tn) : "") +
          (page ? '<div style="margin-top:6px">' + (browserUrl ? "Or download manually: " : "Download manually: ") + link(page, "open the publisher page") + " and save it as " + esc(tn) + ".pdf.</div>" : "");
        btn.disabled = false;
        if (browserUrl) wireBrowserFetch(res, browserUrl, tn, skip);
      }
      st.querySelectorAll("[data-copy]").forEach(x => x.onclick = async () => { try { await navigator.clipboard.writeText(x.dataset.copy); x.textContent = "Copied"; setTimeout(() => x.textContent = x.dataset.copy, 1400); } catch(e){} });
  }


  /* ---------- Download through the PDF Preview tab ----------
     Some publishers (De Gruyter Brill) answer background downloads with a bot
     check that only a real browser passes. "Open in PDF Preview" loads the PDF
     address in the PDF Preview tab (ILLiad's WebView2 browser, on Bowdoin's IP);
     staff download it there, and StrategyAgent.lua catches that one download
     and holds it for review here. The addon never clicks on the publisher's site. */
  function browserFetchHtml(url, tn){
    return '<div class="browserfetch" style="margin-top:10px">' +
      '<button type="button" class="primary" id="pdf-browser">Open in PDF Preview</button> ' +
      '<span class="pct">Opens the PDF in the PDF Preview tab at the top of the request.</span>' +
      '<ol class="pct" style="margin:8px 0 0 18px;padding:0">' +
        "<li>Click the <strong>PDF Preview</strong> tab. If the site shows a check first, it clears by itself (or follow what it asks).</li>" +
        "<li>When the PDF opens there, the addon keeps a copy automatically: there's nothing to click. (If the status below asks, click the viewer's download button ↓ instead.)</li>" +
        "<li>Come back here: the PDF shows up " + (cfg.review ? "for review as " + esc(tn) + ".pdf" : "saved as " + esc(tn) + ".pdf") + ".</li></ol>" +
      '<div id="pdf-browser-status" class="pct" style="margin-top:6px"></div></div>';
  }
  let browserPoll = null;
  function stopBrowserPoll(){ if (browserPoll){ clearInterval(browserPoll); browserPoll = null; } }
  function wireBrowserFetch(res, url, tn, skip){
    const b = $("pdf-browser"); if (!b) return;
    b.onclick = async () => {
      const out = $("pdf-browser-status");
      const r = String(await bridgeCall("OpenInPreview", url, tn).catch(e => "ERR\n" + e.message) || "");
      if (!r.startsWith("OK")){ out.textContent = "Couldn't open it: " + r.replace(/^ERR\s*/, ""); return; }
      b.disabled = true;
      out.innerHTML = '<span class="spin"></span>Opened in the PDF Preview tab. Waiting for the download…';
      stopBrowserPoll();
      const started = Date.now();
      browserPoll = setInterval(async () => {
        if (!$("pdf-browser-status")){ stopBrowserPoll(); bridgeCall("CancelPreviewCapture").catch(() => {}); return; }
        let s = "";
        try { s = String(await bridgeCall("PreviewCaptureStatus") || ""); } catch(e){ s = "ERR\n" + e.message; }
        const [kind, ...rest] = s.split("\n");
        if (kind === "WAIT"){
          const mins = Math.floor((Date.now() - started) / 60000);
          $("pdf-browser-status").innerHTML = '<span class="spin"></span>' + esc(rest[0] || "waiting") + (mins ? " (" + mins + " min)" : "") + "…";
          return;
        }
        stopBrowserPoll();
        track("browser", { outcome: (kind === "PENDING" || kind === "OK") ? "captured" : "failed", host: hostOnly(url),
                           seconds: Math.round((Date.now() - started) / 1000), detail: kind === "ERR" ? rest.join(" ").slice(0, 160) : "" });
        if (kind === "PENDING" || kind === "OK"){
          const [path, bytes, source] = rest;
          const f = { path, checks: esc((Number(bytes)/1048576).toFixed(1) + " MB from " + source), warn: false, doiBad: false,
                      tn, doi: (res.best && res.best.doi) || findDOI(request) || "", route: "browser", skip, source };
          if (kind === "PENDING") return showReview(res, false, f);
          $("pdf-status").innerHTML = '<span class="badge High">Saved</span> ' + esc(path) + '<div class="pct" style="margin-top:6px">' + f.checks + "</div>";
          summary += "\nPDF saved: " + path;
          track("saved", { route: "browser", host: hostOnly(source), detail: "saved without review" });
          return;
        }
        b.disabled = false;
        $("pdf-browser-status").textContent = rest.join(" ") || "Something went wrong.";
      }, 1500);
    };
  }

  /* ---------- Review before saving ----------
     A fetched PDF waits in the review folder. The viewer shows it; Save moves it
     to PdfSaveFolder as <TN>.pdf (ApprovePdf), Discard deletes it (DiscardPdf). */
  function pdfViewerSrc(path){
    if (/^(data|blob|https?):/i.test(path)) return path;                 // preview / test pages
    return "file:///" + encodeURI(String(path).replace(/\\/g, "/")).replace(/#/g, "%23");
  }
  function wireCopy(scope){
    scope.querySelectorAll("[data-copy]").forEach(x => x.onclick = async () => { try { await navigator.clipboard.writeText(x.dataset.copy); const t = x.textContent; x.textContent = "Copied"; setTimeout(() => x.textContent = t, 1400); } catch(e){} });
  }
  /* ---------- First-page check ----------
     Reads the text of the held PDF's first page (and page 2, in case page 1 is a
     cover sheet) with pdf.js, and compares it with the verified citation:
     title, authors, page numbers, DOI, journal and year. */
  const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfjsLoading = null;
  function loadPdfJs(){
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (!pdfjsLoading) pdfjsLoading = new Promise((ok, no) => {
      const s = document.createElement("script");
      s.src = PDFJS_BASE + "pdf.min.js";
      s.onload = () => {
        const lib = window.pdfjsLib;
        if (!lib) { pdfjsLoading = null; return no(new Error("the PDF reader didn't load")); }
        lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
        ok(lib);
      };
      s.onerror = () => { pdfjsLoading = null; no(new Error("couldn't load the PDF reader from cdnjs.cloudflare.com")); };
      document.head.appendChild(s);
    });
    return pdfjsLoading;
  }
  function base64Bytes(b64){
    const bin = atob(String(b64).replace(/\s+/g, ""));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  // -> { numPages, pages:[text of page 1, text of page 2] }
  async function readPdfStart(doc){
    const pages = [];
    for (let i = 1; i <= Math.min(2, doc.numPages); i++){
      const tc = await (await doc.getPage(i)).getTextContent();
      pages.push(tc.items.map(it => (it.str || "") + (it.hasEOL ? "\n" : " ")).join(""));
    }
    return { numPages: doc.numPages, pages };
  }
  // Draw every page into the review frame with pdf.js, so the PDF shows even where
  // the browser's own viewer is blocked (local files in WebView2, sandboxed pages).
  // The browser viewer (iframe) stays until page 1 has been drawn.
  async function renderPdfPages(doc, f){
    const frame = $("pdf-frame");
    const still = () => { const b = $("pdf-frame"); return b && b.dataset.path === f.path ? b : null; };
    if (!frame) return;
    const box = document.createElement("div");
    box.className = "pdfpages";
    const width = Math.max(320, (frame.clientWidth || 700) - 28);
    const dpr = window.devicePixelRatio || 1;
    for (let i = 1; i <= doc.numPages; i++){
      if (!still()) return;
      const page = await doc.getPage(i);
      const scale = width / page.getViewport({ scale: 1 }).width;
      const vp = page.getViewport({ scale: scale * dpr });
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext && canvas.getContext("2d");
      if (!ctx) throw new Error("this browser can't draw PDF pages");
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      canvas.style.width = Math.floor(vp.width / dpr) + "px";
      canvas.setAttribute("aria-label", "Page " + i + " of " + doc.numPages);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const lab = document.createElement("div");
      lab.className = "pdfpage-label"; lab.textContent = "Page " + i + " of " + doc.numPages;
      box.appendChild(canvas); box.appendChild(lab);
      if (i === 1){
        const f2 = still(); if (!f2) return;
        f2.replaceChildren(box);
        const hint = $("viewer-hint"); if (hint) hint.textContent = "All " + doc.numPages + " page" + (doc.numPages === 1 ? "" : "s") + " shown above; scroll to read.";
      }
    }
  }
  // Compare page text with the citation. Returns { verdict:"ok"|"mid"|"bad"|"none", rows:[{part,state,note}] }
  function checkPdfText(res, pdf, rawText, pageLabel){
    const b = res.best || {}, q = reqView(request);
    const raw = String(rawText || "").replace(/(\w)-\s*\n\s*(\w)/g, "$1$2");   // re-join words split across lines
    const text = norm(raw);
    if (text.replace(/\s/g, "").length < 40)
      return { verdict:"none", rows:[{ part:"Text", state:"na", note:"No readable text on the first page (probably a scan). Check it by eye." }] };
    const words = text.split(" "), wordSet = new Set(words);
    const has = w => wordSet.has(w) || (w.length >= 5 && words.some(u => wordMatch(w, u)));
    const coverage = s => { const t = tokens(s).filter(w => w.length > 1); return t.length ? t.filter(has).length / t.length : null; };
    const rows = [];

    // Title
    let titleState = "na";
    const title = [b.title, b.subtitle].filter(Boolean).join(": ") || q.title || "";
    if (title){
      const full = coverage(title), main = coverage(mainTitleOf(title));
      const mainWords = tokens(mainTitleOf(title)).length;
      if (full >= 0.8){ titleState = "ok"; rows.push({ part:"Title", state:"ok", note:"found " + pageLabel }); }
      else if (main >= 0.85 && mainWords >= 2){ titleState = "ok"; rows.push({ part:"Title", state:"ok", note:"main title found " + pageLabel + " (subtitle differs or is missing)" }); }
      else if ((full || 0) >= 0.5){ titleState = "mid"; rows.push({ part:"Title", state:"mid", note:"only partly found (" + Math.round(full*100) + "% of its words)" }); }
      else { titleState = "bad"; rows.push({ part:"Title", state:"bad", note:"not found " + pageLabel }); }
    }

    // Authors / editors (up to six)
    let authState = "na";
    const names = ((b.authors && b.authors.length) ? b.authors : [q.author]).filter(Boolean).slice(0, 6);
    const surnames = [...new Set(names.map(surname).filter(s => s.length > 1))];
    if (surnames.length){
      const found = surnames.filter(has), missing = surnames.filter(s => !found.includes(s));
      const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
      authState = found.length === surnames.length ? "ok" : found.length ? "mid" : "bad";
      rows.push({ part: b.editors ? "Editors" : "Authors", state:authState,
        note: (found.length ? found.map(cap).join(", ") + " found" : "") + (found.length && missing.length ? "; " : "") + (missing.length ? missing.map(cap).join(", ") + " not found" : "") });
    }

    // Page numbers: page count and the first page number
    const range = pageRange(b.pages || q.pages);
    if (range && range.start){
      const startSeen = wordSet.has(String(range.start));
      const want = range.end && range.end >= range.start ? range.end - range.start + 1 : null;
      const n = pdf.numPages;
      let state, note;
      if (want){
        const countOk = n >= want && n <= want + 2;            // allows a cover sheet
        state = countOk && startSeen ? "ok" : "mid";
        note = "PDF has " + n + " page" + (n === 1 ? "" : "s") + "; " + range.start + "–" + range.end + " is " + want +
               (countOk ? (n > want ? " (plus " + (n - want) + " extra, likely a cover sheet)" : "") : " — check it's the whole article and only this article");
      } else {
        state = startSeen ? "ok" : "mid";
        note = "PDF has " + n + " page" + (n === 1 ? "" : "s");
      }
      note += startSeen ? "; page number " + range.start + " appears" : "; page number " + range.start + " not seen";
      rows.push({ part:"Pages", state, note });
    }

    // DOI printed on the page
    let doiState = "na";
    const doi = String(b.doi || findDOI(request) || "").toLowerCase();
    const compact = raw.toLowerCase().replace(/\s+/g, "");
    const printed = [...new Set((raw.match(/10\.\d{4,9}\/[^\s"<>]+/g) || []).map(d => d.toLowerCase().replace(/[.,;)\]]+$/, "")))];
    if (doi && compact.includes(doi)){ doiState = "ok"; rows.push({ part:"DOI", state:"ok", note:"matches" }); }
    else if (doi && printed.length){ doiState = "bad"; rows.push({ part:"DOI", state:"bad", note:"page shows " + printed[0].slice(0, 60) + ", expected " + doi }); }
    else if (doi) rows.push({ part:"DOI", state:"na", note:"not printed " + pageLabel });

    // Journal and year (informational: headers often abbreviate the journal)
    const journal = b.container || q.container || "";
    if (journal && q.kind !== "book"){
      const cov = Math.max(coverage(journal) || 0, coverage(mainTitleOf(journal)) || 0);   // "Critical Arts: A South-North Journal…" -> "Critical Arts"
      rows.push({ part:"Journal", state: cov >= 0.8 ? "ok" : "na", note: cov >= 0.8 ? "found" : "not found (may be abbreviated or only on other pages)" });
    }
    const year = b.year || q.year;
    if (year) rows.push({ part:"Year", state: wordSet.has(String(year)) ? "ok" : "na", note: wordSet.has(String(year)) ? String(year) + " appears" : String(year) + " not seen" });

    const verdict = (titleState === "bad" || doiState === "bad" || authState === "bad") ? "bad"
                  : (titleState === "ok" && (authState === "ok" || authState === "na")) ? "ok"
                  : (titleState === "na" && authState === "na" && doiState === "na") ? "none" : "mid";
    return { verdict, rows };
  }
  function firstPageCheck(res, pdf){
    const one = checkPdfText(res, pdf, pdf.pages[0] || "", "on page 1");
    if (one.verdict === "ok" || pdf.pages.length < 2) return one;
    // Page 1 may be a cover sheet (JSTOR, repositories): try pages 1 and 2 together
    const two = checkPdfText(res, pdf, (pdf.pages[0] || "") + "\n" + pdf.pages[1], "on pages 1–2");
    const rank = { ok:3, mid:2, none:1, bad:0 };
    return rank[two.verdict] > rank[one.verdict] ? two : one;
  }
  const FP_MARK = { ok:"✓", mid:"!", bad:"✗", na:"–" };
  function fpRowsHtml(rows){
    return rows.map(r => '<div class="fp-row"><span class="fp-mark ' + r.state + '">' + FP_MARK[r.state] + "</span><b>" + esc(r.part) + '</b> <span class="pct">' + esc(r.note) + "</span></div>").join("");
  }
  // Verdict for the badge, combining the publisher-page check (f.warn) and the first-page check
  function reviewBadge(f, fp){
    // A first page that matches outweighs a loosely matching page title, but not a different page DOI
    if (f.doiBad || (fp && fp.verdict === "bad")) return ["Low", "Check carefully"];
    if (fp && fp.verdict === "ok") return ["High", "Looks right"];
    if (f.warn) return ["Low", "Check carefully"];
    if (fp && fp.verdict === "mid") return ["Medium", "Partly matches"];
    return f.hasPageChecks ? ["High", "Page matches"] : ["Medium", "Not checked"];
  }
  async function runFirstPageCheck(res, f){
    const box = $("fp-check");
    const still = () => { const b = $("fp-check"); return b && b.dataset.path === f.path ? b : null; };
    let fp = null, err = "";
    try {
      const r = String(await bridgeCall("ReadPdf", f.path) || "");
      if (!r.startsWith("OK\n")) throw new Error(r.replace(/^ERR\s*/, "") || "couldn't read the PDF");
      const lib = await loadPdfJs();
      const doc = await lib.getDocument({ data: base64Bytes(r.slice(3)), isEvalSupported: false }).promise;
      const pdf = await readPdfStart(doc);
      fp = firstPageCheck(res, pdf);
      renderPdfPages(doc, f).catch(() => {});   // keep the browser viewer if drawing fails
    } catch(e){ err = e && e.message ? e.message : String(e); }
    const el = still(); if (!el) return;      // the user already saved or tried again
    if (!fp && /\bgone\b/i.test(err)){         // a held PDF from before leaving the page was cleaned up
      dropReview(f.tn);
      $("pdf-status").innerHTML = '<div class="pct">The PDF held for review earlier is no longer there. Click Fetch PDF to download it again.</div>';
      const fb = $("fetch-pdf"); if (fb) fb.disabled = false;
      return;
    }
    f.fp = fp;
    const [cls, label] = reviewBadge(f, fp);
    const badge = $("review-badge"); if (badge){ badge.className = "badge " + cls; badge.textContent = label; }
    const pageWarn = $("page-warn"); if (pageWarn && cls !== "Low") pageWarn.remove();
    if (fp){
      el.innerHTML = '<div class="pct" style="margin-bottom:4px">First page compared with the citation:</div>' + fpRowsHtml(fp.rows);
      if (fp.verdict === "bad") el.innerHTML += '<p style="margin:6px 0 0">This may be the wrong PDF. Look at the first page before saving, or click Try again.</p>';
    } else {
      el.innerHTML = '<div class="pct">Couldn\'t read the first page (' + esc(err) + "). Check it by eye in the viewer.</div>";
    }
  }

  function showReview(res, auto, f){
    const st = $("pdf-status"), btn = $("fetch-pdf");
    f.hasPageChecks = /page (DOI|title)/.test(f.checks);
    holdReview(f);
    st.innerHTML =
      (auto ? '<div class="pct" style="margin-bottom:6px">Fetched automatically (citation confidence: ' + esc(res.confidence || "unknown") + "). Nothing is saved until you choose." +
              (res.confidence !== "High" ? " The citation isn't fully verified, so compare the first page carefully." : "") + "</div>" : "") +
      '<div class="review-head"><span id="review-badge" class="badge ' + (f.warn ? "Low" : "Medium") + '">' + (f.warn ? "Check carefully" : "Checking…") + '</span> <strong>Review before saving</strong></div>' +
      '<div class="pct" style="margin:6px 0 6px">' + f.checks + "</div>" +
      '<div id="fp-check" class="fp-check" data-path="' + esc(f.path) + '"><div class="progress"><span class="spin"></span>Reading the first page…</div></div>' +
      (f.warn ? '<p id="page-warn" style="margin:0 0 10px">The publisher page may be a different article. Check the title and authors on the first page.</p>' : "") +
      '<div class="pdfframe" id="pdf-frame" data-path="' + esc(f.path) + '"><iframe id="pdf-view" title="Fetched PDF" src="' + esc(pdfViewerSrc(f.path)) + '"></iframe></div>' +
      '<div class="review-actions">' +
        '<button type="button" class="primary" id="pdf-save">Save as ' + esc(f.tn) + '.pdf</button>' +
        '<button type="button" id="pdf-retry" title="Discard this PDF and fetch again a different way">Try again</button>' +
        '<button type="button" id="pdf-tab">Open in PDF Preview tab</button>' +
        '<span class="pct" id="viewer-hint">If the viewer stays blank, use the PDF Preview tab.</span>' +
      "</div>" +
      '<div id="review-msg" class="pct" style="margin-top:8px"></div>';
    const msg = $("review-msg");
    const busy = on => ["pdf-save","pdf-retry","pdf-tab"].forEach(id => { const e = $(id); if (e) e.disabled = on; });
    $("pdf-save").onclick = async () => {
      busy(true);
      let r = "";
      try { r = String(await bridgeCall("ApprovePdf", f.path, f.tn) || ""); } catch(e){ r = "ERR\n" + e.message; }
      const [k, v] = r.split("\n");
      if (k === "OK"){
        st.innerHTML = '<span class="badge High">Saved</span> <button type="button" data-copy="' + esc(v) + '" title="Copy file path">' + esc(v) + "</button>" +
                       '<div class="pct" style="margin-top:6px">' + f.checks + "</div>" +
                       (f.fp ? '<div class="fp-check" style="margin-top:6px">' + fpRowsHtml(f.fp.rows) + "</div>" : "");
        wireCopy(st);
        summary += "\nPDF saved after review: " + v;
        dropReview(f.tn);
        track("review", { outcome: "saved", route: f.route || "", host: hostOnly(f.source), check: f.fp ? f.fp.verdict : "not read" });
        track("saved", { route: f.route || "", host: hostOnly(f.source), check: f.fp ? f.fp.verdict : "not read" });
      } else { msg.textContent = "Couldn't save: " + (v || "unknown error"); busy(false); }
    };
    // Try again: discard this PDF, then fetch again skipping the way that produced it
    $("pdf-retry").onclick = async () => {
      busy(true);
      let r = "";
      try { r = String(await bridgeCall("DiscardPdf", f.path) || ""); } catch(e){ r = "ERR\n" + e.message; }
      if (!r.startsWith("OK")){ msg.textContent = "Couldn't discard this PDF: " + r.replace(/^ERR\s*/, ""); busy(false); return; }
      dropReview(f.tn);
      track("review", { outcome: "try again", route: f.route || "", host: hostOnly(f.source), check: f.fp ? f.fp.verdict : "not read" });
      const skip = [f.skip, f.route].filter(Boolean).join(",");
      await doFetch(res, false, skip || "first");
    };
    $("pdf-tab").onclick = async () => {
      let r = "";
      try { r = String(await bridgeCall("PreviewPdf", f.path) || ""); } catch(e){ r = "ERR\n" + e.message; }
      msg.textContent = r.startsWith("OK") ? "Opened in the PDF Preview tab at the top of the request." : "Couldn't open it: " + r.replace(/^ERR\s*/, "");
    };
    runFirstPageCheck(res, f);
  }

  /* Automatic fetch: only on the first check after the tab opens, only when there
     is a DOI or free copy to fetch, and never twice for the same TN (skipped if
     TN.pdf is already saved). With review on (ReviewPdfBeforeSave) it runs at any
     confidence, since nothing is saved until staff click Save. With review off
     the PDF would be saved straight away, so it still waits for High confidence. */
  /* A PDF held for review is remembered for this tab (sessionStorage), so leaving
     the checker for another website and coming back shows it again instead of
     fetching a second copy. */
  const REVIEW_KEY = tn => "illcheck-review-" + tn;
  function holdReview(f){
    try { sessionStorage.setItem(REVIEW_KEY(f.tn), JSON.stringify({ path:f.path, checks:f.checks, warn:f.warn, doiBad:f.doiBad, tn:f.tn, doi:f.doi, route:f.route, skip:f.skip, source:f.source })); } catch(e){}
  }
  function dropReview(tn){ try { sessionStorage.removeItem(REVIEW_KEY(tn)); } catch(e){} }
  function heldReview(tn){ try { return JSON.parse(sessionStorage.getItem(REVIEW_KEY(tn)) || "null"); } catch(e){ return null; } }

  /* ---------- Citation box ----------
     The verified citation goes to StrategyAgent.lua, which shows it in a box
     on any website opened from this page (never on this page itself). */
  function citationBoxText(res){
    const b = res.best || {}, q = res.q || reqView(request);
    const trusted = !!res.best && (res.confidence === "High" || res.confidence === "Medium");
    const u = trusted ? b : {};
    const L = [];
    const add = (k, v) => { v = Array.isArray(v) ? v.filter(Boolean).join("; ") : v;
      if (v !== undefined && v !== null && String(v).trim()) L.push(k + "\t" + String(v).replace(/[\t\r\n]+/g, " ").trim()); };
    add("TN", request.TransactionNumber);
    add("Status", trusted ? "Verified against " + (b.source || "the databases") + " (confidence " + res.confidence + ")"
                          : "As requested - not verified (confidence " + (res.confidence || "unknown") + ")");
    add("Title", [u.title, u.subtitle].filter(Boolean).join(": ") || q.title);
    add(u.editors ? "Editor" : "Author", (u.authors && u.authors.length) ? u.authors.slice(0, 6) : q.author);
    if (q.kind === "book"){
      add("Publisher", u.publisher || q.publisher); add("Edition", q.edition); add("Year", u.year || q.year);
      add("ISBN", (u.isbn || [])[0] || findISBNs(request)[0]);
    } else {
      add(q.kind === "chapter" ? "Book" : "Journal", u.container || q.container);
      if (q.kind === "chapter") add("Book author", q.bookAuthor);
      add("Volume", u.volume || q.volume); add("Issue", u.issue || q.issue); add("Year", u.year || q.year);
      add("Pages", u.pages || q.pages); add("ISSN", [].concat(u.issn || [])[0] || findISSN(request));
    }
    add("DOI", u.doi || findDOI(request));
    return L.join("\n");
  }
  function sendCitation(res){
    const text = citationBoxText(res);
    window.__citationBoxText = text;
    if (hasBridge()) bridgeCall("SetCitation", text).catch(() => {});
  }
  function hasBridge(){ return !!(window.chrome && window.chrome.webview && window.chrome.webview.hostObjects) && !window.__illPreview; }

  // Inside ILLiad, links open in this tab (not a popup) so the citation box can follow
  document.addEventListener("click", e => {
    const a = e.target && e.target.closest && e.target.closest('a[href^="http"]');
    if (!a || e.defaultPrevented || e.ctrlKey || e.shiftKey || e.metaKey || e.button !== 0) return;
    if (window.__illPreview && window.__illPreviewOpen){ e.preventDefault(); window.__illPreviewOpen(a.href); return; }
    if (!hasBridge()) return;
    e.preventDefault();
    location.href = a.href;
  }, true);

  async function maybeAutoFetch(res){
    const b = res.best || {};
    const tn = String(request.TransactionNumber || "").trim();
    const held = tn && heldReview(tn);
    if (held && held.path && $("pdf-status")){
      const fb = $("fetch-pdf"); if (fb) fb.disabled = true;
      return showReview(res, false, held);
    }
    // Auto-fetch once per request per tab: coming back from another website doesn't fetch again
    let done = false;
    try { done = sessionStorage.getItem("illcheck-autofetched-" + tn) === "1"; } catch(e){}
    if (done) return;
    const hasSource = !!(b.doi || findDOI(request) || (res.oa && res.oa.url) || cfg.eds || (res.almaLinks || []).length);
    if (!cfg.autoPdf || !hasSource || !tn || !$("fetch-pdf")) return;
    if (!cfg.review && res.confidence !== "High") return;
    if (!(window.chrome && window.chrome.webview && window.chrome.webview.hostObjects)) return;
    let existing = "";
    try { existing = String(await bridgeCall("PdfExists", tn) || ""); } catch(e){}
    if (existing){
      $("pdf-status").innerHTML = '<span class="badge Medium">Already saved</span> <button type="button" data-copy="' + esc(existing) + '" title="Copy file path">' + esc(existing) +
        '</button><div class="pct" style="margin-top:6px">Not fetched again automatically. Click Fetch PDF to download another copy.</div>';
      $("pdf-status").querySelectorAll("[data-copy]").forEach(x => x.onclick = async () => { try { await navigator.clipboard.writeText(x.dataset.copy); } catch(e){} });
      return;
    }
    try { sessionStorage.setItem("illcheck-autofetched-" + tn, "1"); } catch(e){}
    await doFetch(res, true);
  }


  async function loadAccess(res){
    const card = $("access-card"); if (!card) return;
    const log = (label, ok) => { const d = out.querySelector("details.card"); if (d) d.insertAdjacentHTML("beforeend", "<div>" + (ok ? "✓ " : "✗ ") + esc(label) + "</div>"); };
    let a;
    try { a = await almaAccess(request, res, log); }
    catch(e){ card.innerHTML = '<h2>Bowdoin access</h2><p class="modetag" style="margin:0">' + esc(e.message) + "</p>"; return; }
    const year = (res.best && res.best.year) || res.q.year;
    const onlineYes = a.online.filter(o => o.available), onlineNo = a.online.filter(o => !o.available);
    // Verified full-text services (cover this item, not filtered out) with a link, in Alma's order: Fetch PDF tries these first
    res.almaLinks = onlineYes.filter(o => /^https?:/i.test(o.url || "")).map(o => [o.name, o.url]);
    let badge, label;
    if (onlineYes.length){ badge = "High"; label = "Online access" + (year ? " for " + year : ""); }
    else if (a.print.length || a.digital.length){ badge = "Medium"; label = a.print.length ? "Print only" : "Digital copy only"; }
    else { badge = "None"; label = "No access found" + (year ? " for " + year : ""); }
    let h = '<h2>Bowdoin access <span class="modetag">from Alma link resolver</span></h2><span class="badge ' + badge + '">' + esc(label) + '</span><ul class="acc">';
    for (const o of onlineYes) h += '<li><span class="mark">✓</span><span><strong>' + esc(o.name) + "</strong>" + (o.coverage ? " · " + esc(o.coverage) : "") + (o.free ? " · free" : "") + (o.url ? " · " + link(o.url, "Open") : "") + (o.note ? '<br><span class="pct">' + esc(o.note) + "</span>" : "") + "</span></li>";
    for (const d of a.digital) h += '<li><span class="mark">✓</span><span><strong>' + esc(d.name) + "</strong> · digital copy" + (d.url ? " · " + link(d.url, "Open") : "") + "</span></li>";
    for (const p of a.print) h += '<li><span class="mark">▪</span><span>Print: ' + esc([p.library, p.location, p.call, p.status].filter(Boolean).join(" · ") || "holding record") + "</span></li>";
    for (const o of onlineNo) h += '<li class="off"><span class="mark">✗</span><span>' + esc(o.name) + (o.coverage ? " · " + esc(o.coverage) : "") + " · doesn't cover this item" + (o.reason ? " (" + esc(o.reason) + ")" : "") + "</span></li>";
    if (!a.online.length && !a.print.length && !a.digital.length) h += '<li class="off"><span class="mark">✗</span><span>The resolver returned no online or print services for this citation.</span></li>';
    h += "</ul>";
    if (a.license.length) h += '<p style="margin:10px 0 0"><strong>License terms:</strong> ' + esc(a.license.join(" · ")) + "</p>";
    h += '<p class="modetag" style="margin:10px 0 0">' + link(a.pageURL, "Open full resolver page") + " · " + esc(new URL(a.base).host) +
         (/\/view\/uresolver\//.test(cfg.alma) ? "" : " (found automatically; save it as AlmaResolverURL in Manage Addons)") + "</p>";
    h += '<details style="margin-top:8px"><summary>Resolver details</summary><div class="pct" style="margin-top:6px">' +
         a.services.map(s => esc(s.type + ": " + Object.entries(s.keys).map(([k,v]) => k + "=" + stripTags(v).slice(0,80)).join(", "))).join("<br>") + "</div></details>";
    card.innerHTML = h;
    summary += "\nBowdoin access: " + label + (onlineYes.length ? " (" + onlineYes.map(o => o.name + (o.coverage ? ", " + o.coverage : "")).join("; ") + ")" : "");
  }


  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const link = (href, text) => '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(text || href) + '</a>';

  function renderFields(){
    $("fields").innerHTML = Object.entries(request).map(([k,v]) => "<dt>" + esc(LABELS[k]||k) + "</dt><dd>" + esc(v) + "</dd>").join("");
    const q = reqView(request);
    $("meta").textContent = (inIlliad ? "TN " + (request.TransactionNumber || "?") : "Test mode") + " · " + q.kind;
  }

  async function check(override){
    $("run").disabled = true; $("copy").disabled = true;
    out.innerHTML = "";
    if (!inIlliad) out.insertAdjacentHTML("beforeend", '<div class="banner">Test mode: opened outside ILLiad, so a sample request is loaded. Pick another sample at the top.</div>');
    const prog = document.createElement("div"); prog.className = "card progress";
    prog.innerHTML = '<div><span class="spin"></span>Checking free databases…</div>'; out.appendChild(prog);
    const log = (label, ok) => prog.insertAdjacentHTML("beforeend", "<div>" + (ok ? "✓ " : "✗ ") + esc(label) + "</div>");
    try {
      const res = await lookUp(request, log, override);
      prog.querySelector(".spin").parentElement.remove();
      (mode === "eresource" ? renderEResource : render)(res);
      const d = document.createElement("details"); d.className = "card"; d.innerHTML = "<summary>Searches run</summary>"; d.append(...prog.childNodes); prog.replaceWith(d);
    } catch(e){
      out.insertAdjacentHTML("beforeend", '<div class="banner err">Something went wrong: ' + esc(e.message) + '. Check this PC can reach api.crossref.org, api.openalex.org and openlibrary.org.</div>');
    }
    $("run").disabled = false;
  }

  function render(res){
    const rows = compareFields(request, res);
    const steps = buildStrategy(request, res, rows);
    const b = res.best;
    summary = summaryText(request, res, rows, steps);
    $("copy").disabled = false;

    let h = verdictCard(res);

    if (res.oa && res.oa.url) h += '<div class="card oa"><h2>Free copy found</h2>' + link(res.oa.url) + '<div class="ids">' + esc([res.oa.version, res.oa.host, res.oa.license].filter(Boolean).join(" · ")) + "</div></div>";
    else if (b && b.doi && !cfg.email) h += '<div class="card"><h2>Free copy</h2>No open-access link in OpenAlex. Add a ContactEmail in the addon settings to also check Unpaywall.</div>';

    h += compareCard(res, rows);

    h += '<div class="card"><h2>Suggested strategy</h2><ol class="steps">' +
         steps.map(s => "<li>" + esc(s.text) + (s.why ? "<small>" + (/^https?:/.test(s.why) ? link(s.why) : esc(s.why)) + "</small>" : "") + "</li>").join("") + "</ol></div>";

    h += '<div class="card"><h2>Search links</h2><div class="links">' + searchLinks(request, res).map(([t,u]) => link(u,t)).join("") + "</div></div>";

    h += othersCard(res);
    out.insertAdjacentHTML("beforeend", h);
    wireOthers(res, render);
    sendCitation(res);
    track("check", checkFields(res, null));
  }
  function checkFields(res, almaCount){
    const b = res.best || {};
    return { confidence: res.confidence || "None",
             outcome: (res.confidence === "High" || res.confidence === "Medium") ? "verified" : "unverified",
             route: b.source || "",
             detail: ["DOI " + ((b.doi || findDOI(request)) ? "yes" : "no"), "free copy " + (res.oa && res.oa.url ? "yes" : "no"),
                      almaCount === null ? "" : "Bowdoin links " + almaCount].filter(Boolean).join("; ") };
  }

  for (const b of document.querySelectorAll(".modes button")) b.onclick = () => { setMode(b.dataset.mode, false); start(); };
  $("run").onclick = () => check();
  $("copy").onclick = async () => {
    const btn = $("copy");
    try { await navigator.clipboard.writeText(summary); btn.textContent = "Copied"; }
    catch(e){ const t = document.createElement("textarea"); t.value = summary; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); btn.textContent = "Copied"; } catch(_){} t.remove(); }
    setTimeout(() => btn.textContent = "Copy summary", 1800);
  };
  window.addEventListener("error", e => out.insertAdjacentHTML("beforeend", '<div class="banner err">Page error: ' + esc(e.message) + "</div>"));

  if (!inIlliad){
    const sel = $("sample"); sel.hidden = false;
    sel.innerHTML = Object.keys(SAMPLES).map(k => "<option>" + esc(k) + "</option>").join("");
    sel.onchange = () => { request = { ...SAMPLES[sel.value] }; renderFields(); setMode(detectMode(request), true); start(); };
    request = { ...SAMPLES[sel.value] };
  }
  renderFields();
  setMode(cfg.mode === "eresource" || cfg.mode === "borrowing" ? cfg.mode : detectMode(request), true);
  start();
})();

if (typeof module !== "undefined") module.exports = { primoOpenURL, parseAlmaCTO, almaCandidates, almaAccess, fieldConfidence, openURL, eHoldingsLinks, eSummary, detectMode, lookUp, similarity, scoreCandidate, reqView, compareFields, buildStrategy, mergeCandidates, confidenceOf, pageRange, findISBNs, findISSN, findDOI, searchLinks, summaryText, citationLine, SAMPLES, RULES, cfg };
</script>
</body>
